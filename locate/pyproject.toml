[project]
name = "locate"
version = "0.1.0"
description = "Serve LocateAnything-3B model using Transformers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=0.34.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "lmdb==1.7.5",
    "numpy>=1.26,<3",
    "opencv-python-headless==4.11.0.86",
    "peft>=0.13.0",
    "pillow==11.1.0",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.9",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "transformers==4.57.1",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
locateanything-api = "locateanything_api.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/locateanything_api", "src/decord"]
